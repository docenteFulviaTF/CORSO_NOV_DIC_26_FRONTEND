<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf - catalogo da JSON</title>
    <link rel="stylesheet" href="catalogo.css" />
    <!-- Niente libri.js: i dati arrivano da libri.json con fetch. Aprire con Live Server. -->
    <script src="es-5-5.js" defer></script>
  </head>
  <body>
    <h1>Catalogo</h1>

    <div class="filtri">
      <input type="search" id="ricerca" placeholder="Titolo o autore" aria-label="Cerca" />
      <select id="genere" aria-label="Genere">
        <option value="">Tutti i generi</option>
        <option>Romanzo</option>
        <option>Racconti</option>
        <option>Giallo</option>
        <option>Saggio</option>
      </select>
    </div>

    <p class="messaggio" id="messaggio"></p>
    <section id="catalogo"></section>
  </body>
</html>
