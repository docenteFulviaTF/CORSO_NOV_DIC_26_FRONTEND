<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giorno 5 - primi eventi</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #fff; color: #222; }
      body.scuro { background: #121821; color: #e6e9ee; }
      section { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
      progress { width: 100%; height: 16px; }
      textarea { width: 100%; font: inherit; }
      .troppo { color: #b00020; font-weight: bold; }
      button { font: inherit; padding: 4px 12px; cursor: pointer; }
    </style>
    <script src="es-5-3.js" defer></script>
  </head>
  <body>
    <h1>Primi eventi</h1>
    <button type="button" id="tema">Tema scuro</button>

    <section>
      <h2>Il nome della rosa - 503 pagine</h2>
      <p>Pagine lette: <strong id="lette">0</strong></p>
      <progress id="barra" max="503" value="0"></progress>
      <p>
        <button type="button" id="meno">-10</button>
        <button type="button" id="piu">+10</button>
        <button type="button" id="azzera">Azzera</button>
      </p>
    </section>

    <section>
      <h2>La tua recensione</h2>
      <textarea id="recensione" rows="5" aria-label="Recensione"></textarea>
      <p><span id="caratteri">0/200 caratteri</span></p>
      <button type="button" id="invia">Invia</button>
    </section>
  </body>
</html>
