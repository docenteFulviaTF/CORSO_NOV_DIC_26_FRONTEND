<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf - catalogo con filtri</title>
    <link rel="stylesheet" href="catalogo.css" />
    <script src="libri.js" defer></script>
    <script src="es-5-4.js" defer></script>
  </head>
  <body>
    <h1>Catalogo</h1>

    <div class="filtri">
      <input type="search" id="ricerca" placeholder="Titolo o autore" aria-label="Cerca" />
      <select id="genere" aria-label="Genere">
        <option value="">Tutti i generi</option>
        <option>Romanzo</option>
        <option>Racconti</option>
        <option>Giallo</option>
        <option>Saggio</option>
      </select>
      <label><input type="checkbox" id="solo-disponibili" /> Solo disponibili</label>
      <button type="button" id="azzera">Azzera filtri</button>
    </div>

    <p id="riepilogo"></p>
    <section id="catalogo"></section>
  </body>
</html>
