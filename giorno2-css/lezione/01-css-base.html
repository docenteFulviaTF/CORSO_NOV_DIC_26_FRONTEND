<!DOCTYPE html>
<html lang="it">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf - CSS di base</title>
    <!-- Il CSS si scrive in un file a parte e si collega nella head -->
    <link rel="stylesheet" href="css/01-css-base.css" />
  </head>

  <body>
    <h1>Il barone rampante</h1>
    <p class="autore">Italo Calvino, 1957</p>

    <p>
      Il 15 giugno 1767 Cosimo Piovasco di Rondò, a dodici anni, sale su un albero
      del giardino e decide che non scenderà più.
    </p>
    <p class="nota">Questo paragrafo ha la classe nota.</p>
    <p id="unico">Questo paragrafo ha l'id unico.</p>

    <section class="trama">
      <h2>Trama</h2>
      <p>Paragrafo dentro la sezione trama.</p>
    </section>

    <p><a href="https://it.wikipedia.org/wiki/Il_barone_rampante">Leggi su Wikipedia</a></p>
  </body>

</html>
