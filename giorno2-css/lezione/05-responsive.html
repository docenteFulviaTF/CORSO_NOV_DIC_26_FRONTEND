<!DOCTYPE html>
<html lang="it">

  <head>
    <meta charset="UTF-8" />
    <!-- Senza questa riga lo schermo dello smartphone finge di essere largo 980px e rimpicciolisce tutto -->
    <meta name="viewport" content="width=device-width, da mettereinitial-scale=1.0" />
    <title>Bookshelf - responsive</title>
    <link rel="stylesheet" href="css/05-responsive.css" />
  </head>

  <body>
    <!-- RESPONSIVE: la stessa pagina si adatta a smartphone e computer.
         Per provarla: F12, poi l'icona del telefono (Ctrl+Shift+M). -->
    <header class="testata">
      <a href="#" class="logo">Bookshelf</a>
      <nav>
        <a href="#">Catalogo</a>
        <a href="#">Autori</a>
        <a href="#">Contatti</a>
      </nav>
    </header>

    <main>
      <h1>Il catalogo della biblioteca</h1>
      <div class="colonne">
        <section>
          <h2>Cerca</h2>
          <p>Trova un libro per titolo o per autore.</p>
        </section>
        <section>
          <h2>Prenota</h2>
          <p>Prenota il libro e ritiralo in biblioteca.</p>
        </section>
        <section>
          <h2>Leggi</h2>
          <p>Hai 30 giorni di tempo.</p>
        </section>
      </div>
      <img src="img/citta-invisibili.svg" alt="Copertina de Le città invisibili" class="foto" />
    </main>
  </body>

</html>
